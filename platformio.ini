[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino

lib_deps =
    adafruit/Adafruit GFX Library
    adafruit/Adafruit SSD1306
    adafruit/RTClib
    bblanchon/ArduinoJson@^7.4.3
    madhephaestus/ESP32Servo@^3.0.5

extra_scripts =
    pre:extra_script.py

board_build.embed_txtfiles =
    medicine-cell-data/config/configuration.json

build_flags =
    -Ischeduling-event-engine/include
    -Imedicine-cell-data/include
    -Ilib/oled-ui-notification-engine/include